<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusHelp - Notifications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
            background: #f5f7fb;
            color: #1f2937;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-top: 0;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 14px 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .unread {
            border-left: 4px solid #2563eb;
            background: #eff6ff;
        }

        .badge {
            background: #2563eb;
            color: white;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 11px;
        }

        button {
            padding: 8px 12px;
            border: none;
            background: #10b981;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .empty {
            color: #64748b;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Notifications</h1>
        <ul id="notification-list"></ul>
    </div>

    <script src="./js/notifications.js"></script>
</body>

</html>
