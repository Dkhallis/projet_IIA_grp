<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusHelp - Messages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
            background: #f5f7fb;
            color: #1f2937;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
            max-width: 900px;
            margin: 0 auto;
        }

        form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        input,
        button {
            border-radius: 8px;
            border: 1px solid #d1d5db;
            padding: 10px 12px;
            font-size: 14px;
        }

        input {
            flex: 1 1 180px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        button.secondary {
            background: #ef4444;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding: 14px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        a {
            color: #1d4ed8;
            text-decoration: none;
            font-weight: 600;
        }

        .meta {
            color: #6b7280;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Messages</h1>

        <form id="conversation-form">
            <input id="conversation-title" type="text" placeholder="Titre de la conversation" required />
            <input id="conversation-user" type="text" placeholder="Nom du destinataire" required />
            <button type="submit">Créer une conversation</button>
        </form>

        <ul id="conversation-list"></ul>
    </div>

    <script src="./js/messages.js"></script>
</body>

</html>
